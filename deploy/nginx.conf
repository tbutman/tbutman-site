# Nginx server blocks for the two static sites: tbutman.com (the default server) and taptilde.com
# (Thomas, October 26: Tilde as its own site, one release, the same server). Installed on the server
# as /etc/tbutman-site/nginx.conf, whose directory the container mounts as /etc/nginx/conf.d; see
# deploy/README.md. CI serves every build through this file and checks the responses of both
# hostnames (deploy/check-nginx.sh).

# Visitor log for the private stats report (deploy/site-stats.sh). Behind Cloudflare Tunnel,
# $remote_addr is the tunnel connector, so log the visitor's address from CF-Connecting-IP.
# Otherwise this is nginx's standard "combined" format, which GoAccess reads as is.
map $http_cf_connecting_ip $visitor_ip {
  "" $remote_addr;
  default $http_cf_connecting_ip;
}
log_format visits '$visitor_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

# Content Security Policy for the site's HTML pages (nothing else gets one: an empty value sends no
# header). Everything comes from the site itself: its scripts, styles, fonts and images, and the
# contact form's /api/contact. The inline scripts are /tilde's forwarder for old contact links
# (scripts/prerender.mjs) and /hello's ?contact=, ?social= and ?links= (scripts/hello-share.mjs),
# allowed by hash; deploy/check-csp.mjs fails the build if any page has an inline script, style or
# event handler this policy would block. /tilde/c sets its own, stricter policy (a meta tag with
# hashes computed at each build), so its location sends only what a meta tag can't.
map $sent_http_content_type $page_csp {
  ~^text/html "default-src 'self'; script-src 'self' 'sha256-c8xI0zS5xN8n7Dr234GNIiFpKmLO+jx//RAxPaOzq7U=' 'sha256-KHX8N8ug7EUwvhTQM3Udg3De1CZ91Pvb6z6DOnFP3zE='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
  default "";
}

# taptilde.com's policy: the same, with its home's forwarder (#1; to /c, #n1; to /n) by hash, and no
# contact form. deploy/check-csp.mjs checks dist-tilde/ against it (SITE=tilde).
map $sent_http_content_type $tilde_page_csp {
  ~^text/html "default-src 'self'; script-src 'self' 'sha256-U4N9FquQlOJ0HL1dWs5/l9lLVGjqzoMVGTIqd0CTlUQ='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
  default "";
}

# tbutman.com's Tilde pages, moved to taptilde.com (Thomas, October 26): each page's twin there.
# Only pages: the images under /tilde/ stay here too, for the case study. A browser keeps the
# #fragment across the redirect, so old contact and note links still open.
map $uri $tilde_twin {
  ~^/tilde/?$                                            /;
  ~^/pt/tilde/?$                                         /pt;
  ~^/tilde/(?<page>card|privacy|fobs|home|uses|app|c|n|w|p|support)/?$ /$page;
  ~^/pt/tilde/(?<ptpage>card|privacy)/?$                 /pt/$ptpage;
  default                                                "";
}

# Each of those redirects adds from=tbutman.com to the query. Since October 10, Cloudflare's
# taptilde.com catch-all was a permanent 301 to tbutman.com/tilde, and browsers keep those: a phone
# that once opened taptilde.com/card would otherwise go taptilde.com/card → tbutman.com/tilde →
# taptilde.com/ → (its cached 301) → tbutman.com/tilde, in a loop. No browser has the URL with the
# query cached, and the stats see the moved traffic.
map $args $moved_args {
  ""      "from=tbutman.com";
  default "$args&from=tbutman.com";
}

# /hello's page for where the visitor came from: the link's ?from= value picks one prerendered for it
# (_hello/, written by scripts/prerender.mjs). The same choice as src/lib/arrival.ts, which
# src/lib/arrival.test.mjs checks against this map. Anything else, or no value, gets the plain page.
map $arg_from $hello_arrival {
  card-qr            card-qr;
  card-nfc           card-nfc;
  key-qr             key-qr;
  key-nfc            fob;
  fob                fob;
  phone              phone;
  phone-android      phone-android;
  phone-android-nfc  phone-android-nfc;
  phone-android-qr   phone-android-qr;
  phone-iphone       phone-iphone;
  qr                 qr;
  nfc                nfc;
  ~^qr-[a-z0-9-]+$   qr;
  ~^nfc-[a-z0-9-]+$  nfc;
  default            "";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # `current` is a symlink to the live release, swapped atomically on deploy.
  root /srv/tbutman-site/current;
  index index.html;

  # Cloudflare terminates TLS; keep redirects relative to the public hostname.
  absolute_redirect off;
  server_tokens off;

  # To a file for the stats report (rotated weekly, kept four weeks), and to stdout as before for
  # `docker compose logs`.
  access_log /var/log/tbutman-site/access.log visits;
  access_log /dev/stdout visits;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy $page_csp always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # The Tilde pages live on taptilde.com now: 301 to their twin, with the query and from=tbutman.com.
  if ($tilde_twin) {
    return 301 https://taptilde.com$tilde_twin?$moved_args;
  }

  # taptilde.com's files ride in the same release (_taptilde/), but only its own hostname serves them.
  location ^~ /_taptilde/ {
    return 404;
  }

  # The arrival pages are only served as /hello?from=… (below).
  location ^~ /_hello/ {
    return 404;
  }

  # /hello and /pt/hello, as the page for the link's ?from= when there is one ($hello_arrival).
  location ~ ^/(?<hello_lang>pt/)?hello$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $page_csp always;
    try_files /_hello/$hello_lang$hello_arrival.html $uri.html =404;
  }

  # Hashed build assets never change, so cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Contact form, proxied to the contact service (services/contact). The upstream is resolved per
  # request through Docker's DNS, so nginx still starts if that container is missing; the form
  # then shows its error message instead.
  location = /api/contact {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $contact_upstream http://contact:3000;
    proxy_pass $contact_upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
  }

  # The /hello page's "save contact" file. nginx's MIME table has no .vcf entry, and phones only
  # offer to add the contact when the file is labeled as a vCard.
  location = /thomas-butman.vcf {
    types { }
    default_type "text/vcard; charset=utf-8";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $page_csp always;
    try_files $uri =404;
  }

  # The résumé used to be /cv and Thomas_Butman_CV.pdf, and those links are still out there
  # (LinkedIn, printed material). The build also writes fallbacks for both (scripts/prerender.mjs),
  # so they keep working on a server that still runs an older copy of this file.
  location = /cv {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $page_csp always;
    return 301 /resume;
  }

  location = /Thomas_Butman_CV.pdf {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $page_csp always;
    return 301 /Thomas_Butman_Resume.pdf;
  }

  # Pages are revalidated so visitors pick up new deploys immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $page_csp always;
    try_files $uri $uri.html $uri/ =404;
  }

  # Not-found responses must never be cached. Without this, nginx sends no Cache-Control on a 404
  # (headers without `always` are dropped on errors) and Cloudflare applies its default browser
  # TTL and edge caching, so a request for a file that a new release has not installed yet could
  # keep returning 404 for hours after it exists.
  location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $page_csp always;
  }

  error_page 404 /404.html;
}

# taptilde.com: Tilde's own site, the Tilde build (dist-tilde/) at the root, from the same release as
# tbutman.com (its _taptilde/ folder), so both sites switch, and roll back, together.
server {
  listen 80;
  listen [::]:80;
  server_name taptilde.com www.taptilde.com;

  root /srv/tbutman-site/current/_taptilde;
  index index.html;

  absolute_redirect off;
  server_tokens off;

  # Its own log, so the stats report each site apart (deploy/site-stats.sh).
  access_log /var/log/tbutman-site/taptilde.log visits;
  access_log /dev/stdout visits;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy $tilde_page_csp always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # One address: www goes to the bare domain.
  if ($host = www.taptilde.com) {
    return 301 https://taptilde.com$request_uri;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The printed short links that aren't pages: the Cards box's /cards, and the Mystery card (302, so
  # its destination can change: deploy/README.md).
  location = /cards {
    return 301 /card$is_args$args;
  }
  # A typed trailing slash (/card/) goes to the page. Letters and digits first, so it never builds an
  # off-site (//host) location.
  location ~ ^(/[A-Za-z0-9][A-Za-z0-9/_.-]*?)/$ {
    return 301 $1$is_args$args;
  }
  location = /mystery {
    return 302 /?from=mystery-card;
  }
  # The App Link's statement for taptilde.com/p (Android checks it at install): JSON, never redirected,
  # an hour's cache so a new certificate takes effect quickly.
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Someone typing the old path on the new domain.
  location = /tilde {
    return 301 /$is_args$args;
  }

  # The contact and note pages, as on tbutman.com before: one cached copy serves every link.
  location = /c {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    try_files /c.html =404;
  }

  location = /n {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    try_files /n.html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $tilde_page_csp always;
    try_files $uri $uri.html $uri/ =404;
  }

  location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $tilde_page_csp always;
  }

  error_page 404 /404.html;
}
