# Nginx server block for the static site. Installed on the server as the container's
# /etc/nginx/conf.d/default.conf; see deploy/README.md.
server {
  listen 80;
  server_name _;

  # `current` is a symlink to the live release, swapped atomically on deploy.
  root /srv/tbutman-site/current;
  index index.html;

  # Cloudflare terminates TLS; keep redirects relative to the public hostname.
  absolute_redirect off;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # Hashed build assets never change, so cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Pages are revalidated so visitors pick up new deploys immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
